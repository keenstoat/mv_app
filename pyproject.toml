[project]
name = "mv-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "aiortc>=1.15.0",
    "av>=17.1.0",
    "colorlog>=6.12.0",
    "cvcuda-cu13>=0.19.0",
    "fastapi>=0.156.4",
    "linuxpy>=0.25.0",
    "nicegui>=3.18.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "psutil>=7.2.2",
    "supervision>=0.31.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "trackers>=2.6.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132", marker = "'tegra' in platform_release" }
torchvision = { index = "pytorch-cu132", marker = "'tegra' in platform_release" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
